<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oishi AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#c9151e;color:#fff;text-align:center}
    .wrap{max-width:900px;margin:0 auto;padding:20px}
    h1{margin:10px 0 4px}
    p{margin:6px 0 14px}
    model-viewer{width:100%;height:70vh;background:linear-gradient(180deg,#df3037,#9f1017);border-radius:20px}
    #ar-button{background:#ffd43b;color:#8b1218;border:none;border-radius:999px;padding:14px 24px;font-size:18px;font-weight:700;cursor:pointer}
    .note{font-size:14px;opacity:.9}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Oishi AR</h1>
    <p>TÙNG TÙNG TÙNG — GỌI MASCOT RA!</p>
   <model-viewer
  src="assets/model.glb"
  ios-src="assets/model.usdz"

  ar
  ar-modes="webxr scene-viewer quick-look"

  camera-controls
  auto-rotate
  shadow-intensity="1"
  exposure="1.05"
  ar-scale="fixed">

  <button slot="ar-button" id="ar-button">
    🐥 XEM TRONG AR
  </button>

</model-viewer>
    <p class="note">Mở trên điện thoại, bấm nút AR, rồi hướng camera xuống mặt bàn hoặc sàn.</p>
  </div>
</body>
</html>
