<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oishi AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #c9151e;
      color: #fff;
      text-align: center
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px
    }

    h1 {
      margin: 10px 0 4px
    }

    p {
      margin: 6px 0 14px
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background: linear-gradient(180deg, #df3037, #9f1017);
      border-radius: 20px
    }
    .viewer-container model-viewer {
      position:  
      relative;
      z-index: 1;
    }
    #ar-button {
      background: #ffd43b;
      color: #8b1218;
      border: none;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer
    }

    .note {
      font-size: 14px;
      opacity: .9
    }

    /* Khung hiển thị model và video trên website */
    .viewer-container {
      position: relative;
      width: 100%;
    }

    /* Video thay hình model trên giao diện website */
    .preview-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 20px;
      z-index: 2;
      pointer-events: none;
    }

    /* Ẩn video khi chuyển sang AR nếu cần */
    .viewer-container.ar-active .preview-video {
      display: none;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Oishi AR</h1>
    <p>TÙNG! TÙNG! TÙNG! — GỌI MASCOT RA!</p>
  </div>
  <div class="viewer-container">

    <model-viewer 
      id="mascot" 
      src="./assets/cartoon+chicken+3d+model.glb"
      ios-src="./assets/cartoon+chicken+3d+model.usdz" alt="Oishi mascot 3D" ar ar-modes="quick-look" camera-controls
      autoplay 
      animation-name="Armature|Dance" 
      shadow-intensity="1" 
      exposure="1.05" 
      ar-scale="auto"
      ar-placement="floor">
      <button slot="ar-button" id="ar-button">
        🐥 XEM TRONG AR
      </button>
    </model-viewer>
    <video class="preview-video" 
      autoplay 
      loop 
      muted 
      playsinline>
      <source src="./assets/oishi.mp4" type="video/mp4">
    </video>
  </div>
  <p class="note">Mở trên điện thoại, bấm nút AR, rồi hướng camera xuống mặt bàn hoặc sàn.</p>
  </div>
</body>

</html>
