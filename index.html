
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Oishi AR</title>

  <!-- CSS được viết trực tiếp trong HTML -->
  <style>
    .viewer-box {
      position: relative;
      width: calc(100% - 48px);
      height: 610px;
      margin: 0 auto;
      border-radius: 24px;
      overflow: hidden;
    }

    #mascot {
      display: block;
      width: 100%;
      height: 100%;
    }

    .oishi-gif {
      position: absolute;
      width: 140px;
      height: auto;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      object-fit: contain;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <h1>Oishi AR</h1>
  <p>TÙNG TÙNG TÙNG — GỌI MASCOT RA!</p>

  <!-- Khung chứa model 3D và GIF -->
  <div class="viewer-box">

    <model-viewer
      id="mascot"
      src="./assets/cartoon+chicken+3d+model.glb"
      ios-src="./assets/cartoon+chicken+3d+model.usdz"
      camera-controls
      ar
      ar-modes="webxr scene-viewer quick-look">
    </model-viewer>

    <!-- GIF xuất hiện ở góc dưới bên phải -->
    <img
      src="./assets/oishi.mp4"
      class="oishi-gif"
      alt="Oishi mascot">

  </div>

</body>
</html>
